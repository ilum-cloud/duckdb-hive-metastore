#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      TIDY_THREADS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build ccache git linux-libc-dev flex bison libcurl4-openssl-dev libssl-dev libthrift-dev thrift-compiler

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spark seeder image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./test
          file: ./test/Dockerfile.spark
          tags: hive-metastore-test-spark-seeder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          make -j$(nproc) test-all
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          NINJA_STATUS: '[%f/%t %es] '

  # Independent Spark cross-engine verification job. Runs in parallel with `test`
  # and is NOT in any `needs:` chain — a Spark-side regression fails its own job
  # without blocking the main `test` job or binary shipping.
  # This duplicates the build + env-up sequence with the `test` job (~2x CI minutes),
  # but the tradeoff is intentional: independent failure surfaces and parallel
  # execution (faster wall-clock) outweigh the duplicated work.
  #
  # The `test-spark-verify` Makefile target covers three things end to end:
  #   1. DuckDB sqllogictest suite populates the `duck_*` tables.
  #   2. test/spark_verify/insert_scenarios.sql populates the `xverify_*` tables.
  #   3. spark_verify_writes.py runs in `bidirectional` mode — Spark reads every
  #      DuckDB-written table AND appends rows into one Parquet and one CSV
  #      target, re-verifying counts. This exercises the Spark write path on
  #      every CI run, not just manual debugging.
  spark-verify:
    name: Spark Cross-Engine Verify
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      TIDY_THREADS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build ccache git linux-libc-dev flex bison libcurl4-openssl-dev libssl-dev libthrift-dev thrift-compiler

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spark seeder image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./test
          file: ./test/Dockerfile.spark
          tags: hive-metastore-test-spark-seeder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Spark cross-engine verification
        run: |
          make -j$(nproc) test-spark-verify
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          NINJA_STATUS: '[%f/%t %es] '

  duckdb-stable-build:
    name: Build extension binaries
    needs: test
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      exclude_archs: "${{ github.event_name == 'pull_request' && 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64;windows_arm64;' || 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;windows_arm64;' }}"
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      skip_tests: true
      extension_name: hive_metastore
      extra_toolchains: "parser_tools"

  code-format-check:
    name: Code Quality Check
    uses: ./.github/workflows/_extension_code_quality.yml
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: hive_metastore
      format_checks: 'format;tidy'
